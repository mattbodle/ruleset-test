name: Ruleset test bot check

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Report a successful test bot status on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}"
          -f state=success
          -f context=ruleset-test/bot-check
          -f description="Ruleset test bot check passed"
