name: Ruleset Test Safe PR Gate

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to re-evaluate
        required: false
        type: string
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]
  status:

permissions:
  checks: write
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: ruleset-test-safe-pr-gate-${{ github.event_name == 'schedule' && 'poll' || github.event.pull_request.number || github.event.sha || inputs.pull_request_number || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      vars.RULESET_TEST_SAFE_PR_GATE_ENABLED == 'true' &&
      (github.event_name == 'pull_request_target' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'status' && github.event.context == 'ruleset-test/bot-check'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Evaluate pull request
        uses: ./.github/actions/ruleset-test-safe-pr-gate
        with:
          api-url: ${{ github.api_url }}
          event-path: ${{ github.event_path }}
          github-token: ${{ github.token }}
          mode: ${{ vars.RULESET_TEST_SAFE_PR_GATE_MODE }}
          policy-path: .github/ruleset-test-safe-pr-gate-policy.json
          pr-number: ${{ inputs.pull_request_number }}
