name: Ruleset test Safe PR Gate tests

on:
  pull_request:
    paths:
      - ".github/actions/ruleset-test-safe-pr-gate/**"
      - ".github/ruleset-test-safe-pr-gate-policy.json"
      - ".github/workflows/ruleset-test-safe-pr-gate*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: node --test .github/actions/ruleset-test-safe-pr-gate/test/gate.test.js
